<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareNav AI - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">🚑</div>

            <h1>CareNav AI</h1>

            <p class="subtitle">
                AI Health Assistant & Hospital Navigation
            </p>

            <h2>Login</h2>

            <input
                type="text"
                id="username"
                placeholder="Enter your name"
            >

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button onclick="loginUser()">
                🔐 Login
            </button>

            <p id="loginMessage"></p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
